<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAN1 Peer Network Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      }

      h1 {
        color: #667eea;
        font-size: 2.5em;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .subtitle {
        color: #666;
        font-size: 1.1em;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        transition: transform 0.3s ease;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-label {
        color: #888;
        font-size: 0.9em;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stat-value {
        font-size: 2.5em;
        font-weight: bold;
        color: #667eea;
      }

      .peers-section {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        margin-bottom: 30px;
      }

      .section-title {
        font-size: 1.8em;
        color: #333;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .peers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .peer-card {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        border-left: 4px solid #667eea;
        transition: all 0.3s ease;
      }

      .peer-card:hover {
        background: #f0f1f5;
        transform: translateX(5px);
      }

      .peer-card.offline {
        border-left-color: #dc3545;
        opacity: 0.7;
      }

      .peer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .peer-name {
        font-weight: bold;
        color: #333;
        font-size: 1.2em;
      }

      .peer-status {
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.8em;
        font-weight: bold;
        text-transform: uppercase;
      }

      .status-connected {
        background: #d4edda;
        color: #155724;
      }

      .status-disconnected {
        background: #f8d7da;
        color: #721c24;
      }

      .status-offline {
        background: #e2e3e5;
        color: #383d41;
      }

      .peer-info {
        display: grid;
        gap: 10px;
        color: #666;
        font-size: 0.9em;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
      }

      .info-label {
        color: #888;
        font-weight: 500;
      }

      .network-visualization {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
        margin-bottom: 30px;
      }

      .network-title {
        font-size: 1.5em;
        color: #333;
        margin-bottom: 20px;
      }

      .network-diagram {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 40px;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .node {
        width: 60px;
        height: 60px;
        background: #667eea;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        position: relative;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      .node.offline {
        background: #6c757d;
      }

      .connection-line {
        position: absolute;
        height: 2px;
        background: #667eea;
        opacity: 0.3;
      }

      .logs-section {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      }

      .section-title {
        font-size: 1.8em;
        color: #333;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .log-entry {
        padding: 10px;
        border-bottom: 1px solid #eee;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
        color: #666;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-entry.error {
        color: #dc3545;
      }

      .log-entry.success {
        color: #28a745;
      }

      .refresh-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s ease;
        margin-top: 20px;
      }

      .refresh-btn:hover {
        background: #5568d3;
      }

      .no-peers {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 1.1em;
      }

      .last-updated {
        text-align: right;
        color: #888;
        font-size: 0.85em;
        margin-top: 15px;
      }

      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }

        .peers-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 1.8em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <span>🌐</span>
          PLAN1 Peer Network Dashboard
        </h1>
        <p class="subtitle">Real-time monitoring and management of your peer-to-peer network</p>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Peers</div>
          <div class="stat-value" id="total-peers">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Connections</div>
          <div class="stat-value" id="active-connections">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Network Health</div>
          <div class="stat-value" id="network-health">-%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Uptime</div>
          <div class="stat-value" id="uptime">00:00</div>
        </div>
      </div>

      <div class="peers-section">
        <div class="section-title">
          <span>🔗</span>
          Connected Peers
        </div>
        <div class="peers-grid" id="peers-container">
          <div class="no-peers">Loading peer data...</div>
        </div>
        <div class="last-updated" id="last-updated"></div>
      </div>

      <div class="network-visualization">
        <div class="network-title">Network Topology</div>
        <div class="network-diagram" id="network-diagram">
          <div class="node">YOU</div>
        </div>
      </div>

      <div class="logs-section">
        <div class="section-title">
          <span>📜</span>
          Recent Activity
        </div>
        <div id="logs-container">
          <div class="log-entry">[SYSTEM] Dashboard initialized</div>
        </div>
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh Data</button>
      </div>
    </div>

    <script>
      let startTime = null;
      let logs = [];

      function addLog(message, type = '') {
        const logsContainer = document.getElementById('logs-container');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry ' + type;
        const timestamp = new Date().toLocaleTimeString();
        logEntry.textContent = `[${timestamp}] ${message}`;
        logsContainer.appendChild(logEntry);
        logsContainer.scrollTop = logsContainer.scrollHeight;
        
        // Keep only last 50 logs
        while (logsContainer.children.length > 50) {
          logsContainer.removeChild(logsContainer.firstChild);
        }
      }

      function formatTime(isoString) {
        if (!isoString) return 'N/A';
        const date = new Date(isoString);
        return date.toLocaleString();
      }

      function getStatusClass(status) {
        if (status.includes('Connected')) return 'status-connected';
        if (status.includes('Unresponsive')) return 'status-disconnected';
        return 'status-offline';
      }

      function renderPeerCard(peer) {
        const isAlive = peer.alive;
        const cardClass = isAlive ? 'peer-card' : 'peer-card offline';
        const statusClass = getStatusClass(peer.status);
        
        return `
          <div class="${cardClass}">
            <div class="peer-header">
              <div class="peer-name">${escapeHtml(peer.hostname)}</div>
              <div class="peer-status ${statusClass}">${escapeHtml(peer.status)}</div>
            </div>
            <div class="peer-info">
              <div class="info-row">
                <span class="info-label">IP Address:</span>
                <span>${escapeHtml(peer.ip_address)}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Port:</span>
                <span>${peer.ip_address.includes(':') ? peer.ip_address.split(':').pop() : '39001'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Verified:</span>
                <span>${peer.verified ? '✓ Yes' : '✗ No'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Connected:</span>
                <span>${formatTime(peer.connected_at)}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Last Message:</span>
                <span>${formatTime(peer.last_message_time)}</span>
              </div>
              ${peer.last_heartbeat_received ? `
              <div class="info-row">
                <span class="info-label">Last Heartbeat:</span>
                <span>${formatTime(peer.last_heartbeat_received)}</span>
              </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function updateNetworkDiagram(peers) {
        const diagram = document.getElementById('network-diagram');
        // Clear existing peer nodes (keep the YOU node)
        const nodes = diagram.querySelectorAll('.node:not(:first-child)');
        const lines = diagram.querySelectorAll('.connection-line');
        nodes.forEach(n => n.remove());
        lines.forEach(l => l.remove());

        const activePeers = peers.filter(p => p.alive);
        
        activePeers.forEach((peer, index) => {
          const peerNode = document.createElement('div');
          peerNode.className = 'node';
          peerNode.style.position = 'absolute';
          peerNode.style.left = `${100 + (index % 4) * 100}px`;
          peerNode.style.top = `${50 + Math.floor(index / 4) * 80}px`;
          peerNode.textContent = peer.hostname.substring(0, 4).toUpperCase();
          peerNode.title = peer.hostname;
          diagram.appendChild(peerNode);

          // Add connection line
          const connectionLine = document.createElement('div');
          connectionLine.className = 'connection-line';
          connectionLine.style.left = '60px';
          connectionLine.style.top = `${80 + Math.floor(index / 4) * 80}px`;
          connectionLine.style.width = `${90 + (index % 4) * 100}px`;
          diagram.appendChild(connectionLine);
        });
      }

      async function fetchPeers() {
        try {
          const response = await fetch('/api/peers');
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const peers = await response.json();
          return Array.isArray(peers) ? peers : [];
        } catch (error) {
          console.error('Failed to fetch peers:', error);
          addLog(`Failed to fetch peers: ${error.message}`, 'error');
          return [];
        }
      }

      async function updateDashboard() {
        const peers = await fetchPeers();
        
        // Update stats
        const totalPeers = peers.length;
        const activePeers = peers.filter(p => p.alive).length;
        const health = totalPeers > 0 ? Math.round((activePeers / totalPeers) * 100) : 100;
        
        document.getElementById('total-peers').textContent = totalPeers;
        document.getElementById('active-connections').textContent = activePeers;
        document.getElementById('network-health').textContent = health + '%';
        
        // Update uptime
        if (!startTime) {
          startTime = new Date();
        }
        const now = new Date();
        const diff = now - startTime;
        const hours = Math.floor(diff / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        document.getElementById('uptime').textContent =
          `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        // Render peers
        const peersContainer = document.getElementById('peers-container');
        
        if (peers.length === 0) {
          peersContainer.innerHTML = '<div class="no-peers">No peers connected yet. Peers will appear here when they connect via TLS.</div>';
        } else {
          peersContainer.innerHTML = peers.map(renderPeerCard).join('');
        }
        
        // Update network diagram
        updateNetworkDiagram(peers);
        
        // Update last updated timestamp
        document.getElementById('last-updated').textContent = 
          `Last updated: ${new Date().toLocaleTimeString()}`;
      }

      function refreshData() {
        addLog('Refreshing peer data...', 'success');
        updateDashboard();
      }

      // Initialize dashboard when page loads
      window.addEventListener('load', () => {
        addLog('Dashboard loaded, fetching peer data...', 'success');
        updateDashboard();
        
        // Auto-refresh every 5 seconds
        setInterval(() => {
          updateDashboard();
        }, 5000);
      });
    </script>
  </body>
</html>
